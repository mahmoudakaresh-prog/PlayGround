<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><link rel="manifest" href="manifest.webmanifest"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Viajero — مغامرة الإسبانية</title>
<style>
:root{--ink:#18302f;--cream:#fbf8ef;--mint:#d8eee5;--green:#2f8068;--lime:#d7e65c;--orange:#ee9b64;--yellow:#f6c95f;--pink:#efb6ad;--line:#18302f26}*{box-sizing:border-box}body{margin:0;font-family:"Noto Kufi Arabic",sans-serif;color:var(--ink);background:var(--cream);overflow:hidden}.app{height:100vh;height:100dvh;display:grid;grid-template-columns:240px 1fr}.sidebar{background:#e4efe7;border-left:1px solid var(--line);padding:22px 18px;display:flex;flex-direction:column;z-index:3}.brand{display:flex;align-items:center;gap:10px;font-family:Nunito;font-size:23px;font-weight:800}.logo{width:42px;height:42px;border-radius:50%;background:var(--ink);color:white;display:grid;place-items:center;transform:rotate(-7deg);font-size:22px}.profile{margin:22px 0 18px;padding:14px;border:1px solid var(--line);border-radius:18px;background:#f7faf3}.profile-top{display:flex;align-items:center;gap:10px}.avatar{width:44px;height:44px;border-radius:50%;background:var(--yellow);display:grid;place-items:center;font-size:24px}.name{font-weight:800;font-size:14px}.level{font-size:11px;opacity:.65}.xpbar{height:7px;background:#ccdcd3;border-radius:99px;margin-top:11px;overflow:hidden}.xpbar i{display:block;width:42%;height:100%;background:var(--orange);border-radius:99px}.nav{display:flex;flex-direction:column;gap:7px}.nav button{border:0;background:transparent;color:var(--ink);padding:11px 12px;border-radius:12px;display:flex;align-items:center;gap:11px;font:700 13px "Noto Kufi Arabic";cursor:pointer;text-align:right}.nav button.active{background:white;box-shadow:0 4px 16px #18302f0b}.nav .icon{width:30px;height:30px;border-radius:9px;background:var(--mint);display:grid;place-items:center}.sidebar-bottom{margin-top:auto}.offline{font-size:11px;display:flex;gap:8px;align-items:center;color:#527064}.offline i{width:8px;height:8px;border-radius:50%;background:#70a95b}.main{position:relative;overflow:hidden}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:14px 28px;position:absolute;z-index:2;left:0;right:0}.title{font-size:20px;font-weight:800}.resources{display:flex;gap:8px}.pill{height:42px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:0 13px;display:flex;align-items:center;gap:7px;font:800 13px Nunito}.map{position:absolute;inset:0;background-color:#f8f4e8;background-image:radial-gradient(#b7c8bd55 1px,transparent 1px);background-size:24px 24px}.map:before{content:"";position:absolute;width:520px;height:520px;border-radius:50%;background:#dfead2;right:-150px;top:-190px}.route{position:absolute;inset:76px 0 0 0}.road{position:absolute;left:50%;top:54%;width:520px;height:320px;transform:translate(-50%,-50%) rotate(-8deg);border:8px solid transparent;border-top-color:#c6a65c55;border-right-color:#c6a65c55;border-radius:50%;clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}.island{position:absolute;border-radius:48% 52% 44% 56%;box-shadow:inset 0 0 0 8px #ffffff55}.island.one{width:230px;height:190px;background:#bcd8c4;right:11%;top:24%;transform:rotate(8deg)}.island.two{width:310px;height:260px;background:#cce0c8;left:12%;top:27%;transform:rotate(-12deg)}.island.three{width:220px;height:180px;background:#dfd9ad;right:31%;bottom:-4%}.city{position:absolute;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;border:0;background:transparent;color:var(--ink);font-family:"Noto Kufi Arabic";z-index:2}.city .bubble{width:68px;height:68px;border-radius:50%;border:5px solid white;background:var(--orange);display:grid;place-items:center;font-size:28px;box-shadow:0 8px 20px #18302f22}.city.done .bubble{background:var(--lime)}.city.locked{filter:grayscale(.7);opacity:.72}.city.locked .bubble{background:#b7c2b9}.city .label{background:white;border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:11px;font-weight:800;white-space:nowrap}.city1{right:21%;top:35%}.city2{left:24%;top:30%}.city3{right:41%;bottom:16%}.city4{left:31%;bottom:12%}.city5{right:13%;bottom:8%}.decor{position:absolute;font-size:20px;opacity:.9}.chat{position:absolute;left:28px;bottom:24px;width:min(390px,calc(100% - 56px));background:white;border:1px solid var(--line);border-radius:24px;padding:15px;box-shadow:0 16px 40px #18302f18;z-index:5;display:none}.chat.open{display:block}.chat-head{display:flex;align-items:center;justify-content:space-between}.speaker{display:flex;align-items:center;gap:9px}.portrait{width:42px;height:42px;border-radius:50%;background:var(--pink);display:grid;place-items:center}.speaker-name{font-size:12px;font-weight:800}.speaker-name span{display:block;font-size:9px;opacity:.6}.close{border:0;background:#edf3ef;width:30px;height:30px;border-radius:50%;cursor:pointer}.bubble-text{background:#edf5ef;border-radius:16px 16px 16px 4px;padding:12px;margin:11px 0;font-size:15px;font-family:Nunito,"Noto Kufi Arabic";line-height:1.7}.choices{display:grid;gap:7px}.choice{border:1px solid var(--line);background:white;border-radius:12px;padding:9px 11px;text-align:right;font:700 12px "Noto Kufi Arabic";cursor:pointer}.choice:hover,.choice.correct{background:var(--lime);border-color:#9aa83d}.choice.wrong{background:#f4d0c9}.chat-actions{display:flex;gap:7px;margin-top:9px}.chat-actions button{border:0;border-radius:10px;padding:8px 11px;font:800 11px "Noto Kufi Arabic";cursor:pointer}.speak{background:var(--ink);color:white}.next{background:var(--yellow);margin-right:auto}.drawer{display:none;position:absolute;inset:76px 0 0 0;background:#fbf8ef;z-index:4;padding:24px 30px;overflow:auto}.drawer.open{display:block}.drawer h2{margin-top:0}.lessons{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}.lesson{border:1px solid var(--line);border-radius:18px;background:white;padding:16px}.lesson h3{font-size:14px;margin:0 0 6px}.lesson p{font-size:11px;line-height:1.7;opacity:.7}.lesson button{border:0;background:var(--mint);border-radius:10px;padding:7px 10px;font:800 11px "Noto Kufi Arabic";cursor:pointer}.toast{position:absolute;z-index:10;top:82px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--ink);color:white;border-radius:99px;padding:9px 15px;font-size:12px;opacity:0;transition:.25s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(max-width:700px){.app{grid-template-columns:1fr}.sidebar{position:absolute;bottom:0;height:68px;width:100%;border-left:0;border-top:1px solid var(--line);padding:7px 10px}.brand,.profile,.sidebar-bottom{display:none}.nav{height:100%;flex-direction:row;justify-content:space-around}.nav button{flex-direction:column;gap:2px;padding:3px 8px;font-size:9px}.nav .icon{width:28px;height:28px}.main{height:calc(100dvh - 68px)}.topbar{height:64px;padding:10px 14px}.title{font-size:16px}.resources{gap:4px}.pill{height:36px;padding:0 8px;font-size:11px}.island.one{right:-10%;top:20%}.island.two{width:260px;left:-13%;top:28%}.island.three{right:22%;bottom:-1%}.city1{right:15%;top:32%}.city2{left:16%;top:25%}.city3{right:39%;bottom:17%}.city4{display:none}.city5{right:8%;bottom:8%}.city .bubble{width:58px;height:58px}.chat{left:10px;bottom:10px;width:calc(100% - 20px)}.drawer{inset:64px 0 0 0;padding:18px 14px}.route{inset:64px 0 0 0}}
</style>
</head>
<body><div class="app"><aside class="sidebar"><div class="brand"><div class="logo">V</div> viajero</div><div class="profile"><div class="profile-top"><div class="avatar">🧑🏽</div><div><div class="name">مستكشف جديد</div><div class="level">المستوى A1 · مبتدئ</div></div></div><div class="xpbar"><i id="xpbar"></i></div></div><nav class="nav"><button class="active" data-view="map"><span class="icon">🗺️</span>العالم</button><button data-view="lessons"><span class="icon">📚</span>الدروس</button><button data-view="progress"><span class="icon">📊</span>التقدم</button><button data-view="settings"><span class="icon">⚙️</span>الإعدادات</button></nav><div class="sidebar-bottom"><div class="offline"><i></i> يعمل بلا إنترنت</div></div></aside><main class="main"><div class="topbar"><div class="title">رحلة عبر إسبانيا</div><div class="resources"><div class="pill">🔥 <b id="streak">3</b></div><div class="pill">❤️ <b id="hearts">5</b></div><div class="pill">✦ <b id="xp">420</b></div></div></div><div class="map"><div class="route"><div class="island one"></div><div class="island two"></div><div class="island three"></div><div class="road"></div><button class="city city1 done" data-level="0"><span class="bubble">☕</span><span class="label">مدرسة الأحد</span></button><button class="city city2" data-level="1"><span class="bubble">🏠</span><span class="label">السوق · A1</span></button><button class="city city3" data-level="2"><span class="bubble">🚇</span><span class="label">محطة القطار · A2</span></button><button class="city city4 locked" data-level="3"><span class="bubble">🏨</span><span class="label">الفندق · A2</span></button><button class="city city5 locked" data-level="4"><span class="bubble">🌆</span><span class="label">مدريد · B1</span></button><span class="decor" style="right:48%;top:28%">🌳</span><span class="decor" style="left:16%;top:55%">🌵</span><span class="decor" style="right:55%;top:49%">🌴</span></div></div><div class="chat" id="chat"><div class="chat-head"><div class="speaker"><div class="portrait">👩🏻</div><div class="speaker-name" id="speaker">لولا<span>من أهل مدريد</span></div></div><button class="close" id="close">×</button></div><div class="bubble-text" id="sentence">¡Hola! ¿Cómo te llamas?</div><div class="choices" id="choices"></div><div class="chat-actions"><button class="speak" id="speak">🔊 استمع</button><button class="next" id="next">التالي ←</button></div></div><div class="drawer" id="drawer"></div><div class="toast" id="toast"></div></main></div>
<script>
const $=s=>document.querySelector(s),chat=$('#chat'),choices=$('#choices');
let xp=420,hearts=5,idx=0,level=0;
const conversations=[
 {a:'¡Hola! ¿Cómo te llamas?',ar:'مرحبًا! ما اسمك؟',opts:['Me llamo Samir','Tengo treinta años','Soy de Madrid'],correct:0,s:'Hola, soy Lola'},
 {a:'¿De dónde eres?',ar:'من أين أنت؟',opts:['Estoy bien','Soy de Arabia Saudita','Tengo un gato'],correct:1,s:'Soy de Barcelona'},
 {a:'¿Cuántos años tienes?',ar:'كم عمرك؟',opts:['Tengo veinticinco años','Me llamo Ana','Vivo aquí'],correct:0,s:'Tengo veinticinco años'},
 {a:'¿Qué quieres comprar?',ar:'ماذا تريد أن تشتري؟',opts:['Dos cafés, por favor','Son las tres','Voy al cine'],correct:0,s:'Dos cafés, por favor'},
 {a:'¿Cuánto cuesta el billete?',ar:'بكم التذكرة؟',opts:['A las ocho','Treinta euros','Soy estudiante'],correct:1,s:'Treinta euros'},
 {a:'¿Dónde está la estación?',ar:'أين المحطة؟',opts:['A la derecha','El viernes','Mucho gusto'],correct:0,s:'Está a la derecha'},
 {a:'¿Quieres reservar una habitación?',ar:'هل تريد حجز غرفة؟',opts:['Sí, una habitación doble','Está lloviendo','No trabajo aquí'],correct:0,s:'Una habitación doble'},
 {a:'¿Qué te gusta hacer?',ar:'ماذا تحب أن تفعل؟',opts:['Me gusta viajar','Tengo hambre','Es tarde'],correct:0,s:'Me gusta viajar'},
 {a:'¿Has estado en España antes?',ar:'هل زرت إسبانيا من قبل؟',opts:['Sí, el verano pasado','A las nueve','No tengo llave'],correct:0,s:'Sí, el verano pasado'},
 {a:'¿Qué opinas del problema?',ar:'ما رأيك بالمشكلة؟',opts:['Creo que debemos hablar','No tengo coche','Buenos días'],correct:0,s:'Creo que debemos hablar'}];
const scenes=['la cafetería','el mercado','la estación','el hotel','la oficina','el parque','el museo','el aeropuerto','la universidad','la ciudad'];
const questions=['¿Dónde está','¿Cómo prefieres','¿Cuánto cuesta','¿Qué puedes hacer en','¿Cuándo vamos a','¿Por qué visitamos','¿Tienes tiempo para','¿Me puedes ayudar con'];
const answers=['Está cerca de aquí','Prefiero ir caminando','Cuesta quince euros','Puedo reservar una entrada','Vamos mañana por la mañana','Porque me interesa mucho','Sí, tengo una hora','Claro, con mucho gusto'];
for(let i=conversations.length;i<300;i++){const k=i%10, j=i%8;conversations.push({a:questions[j]+' '+scenes[k]+'?',ar:'محادثة تفاعلية رقم '+(i+1),opts:[answers[j],'No entiendo','Puede ser mañana'],correct:0,s:answers[j]})}
function render(){let c=conversations[idx%conversations.length];$('#sentence').textContent=c.a;choices.innerHTML='';c.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>answer(i,b,c);choices.appendChild(b)});}
function answer(i,b,c){if(b.classList.contains('correct'))return;if(i===c.correct){b.classList.add('correct');xp+=20;$('#xp').textContent=xp;$('#xpbar').style.width=Math.min(100,(xp/1000)*100)+'%';toast('أحسنت! +20 خبرة')}else{b.classList.add('wrong');hearts=Math.max(0,hearts-1);$('#hearts').textContent=hearts;toast('جرّب مجددًا')}renderLevel()}
function renderLevel(){let levelName=['A1 · مبتدئ','A1 · مبتدئ','A2 · أساسيات','A2 · أساسيات','B1 · متوسط'][level];$('.level').textContent='المستوى '+levelName}
function speak(text){if(!('speechSynthesis' in window)){toast('المتصفح لا يدعم الصوت');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text||conversations[idx%conversations.length].a);u.lang='es-ES';u.rate=.82;speechSynthesis.speak(u)}
function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1800)}
function openChat(n){level=n;idx=n*2;render();chat.classList.add('open');renderLevel();}
document.querySelectorAll('.city').forEach((el,n)=>el.onclick=()=>{if(el.classList.contains('locked'))toast('أكمل المرحلة السابقة لفتحها');else openChat(n)});
$('#close').onclick=()=>chat.classList.remove('open');$('#next').onclick=()=>{idx=(idx+1)%conversations.length;render()};$('#speak').onclick=()=>speak();
const lessons=[['التعارف','Hola · Me llamo · Soy de','أتعرف نفسك وتقول من أين أنت'],['في المقهى','Quisiera · Por favor · La cuenta','تطلب وتدفع بثقة'],['الاتجاهات','Derecha · izquierda · cerca','تسأل وتفهم الطريق'],['السفر','Billete · estación · salida','تحجز وتنتقل بسهولة'],['حديث B1','Creo que · sin embargo · aunque','تعبر عن رأيك وخطتك']];
function drawerView(v){let d=$('#drawer');d.classList.add('open');if(v==='lessons')d.innerHTML='<h2>مكتبة الدروس</h2><div class="lessons">'+lessons.map((l,i)=>`<div class="lesson"><h3>${l[0]}</h3><p><b>${l[1]}</b><br>${l[2]}</p><button onclick="openChat(${Math.min(i,4)})">ابدأ محادثة</button></div>`).join('')+'</div>';else if(v==='progress')d.innerHTML='<h2>تقدمك</h2><div class="lessons"><div class="lesson"><h3>محادثات مكتملة</h3><p><b>12 / 300</b><br>أنت في الطريق إلى B1</p></div><div class="lesson"><h3>السلسلة</h3><p><b>3 أيام</b><br>استمر يومًا آخر!</p></div></div>';else if(v==='settings')d.innerHTML='<h2>الإعدادات</h2><div class="lessons"><div class="lesson"><h3>الصوت الإسباني</h3><p>يعمل عبر أصوات المتصفح المتاحة دون اتصال بعد التنزيل.</p><button onclick="speak()">اختبر الصوت</button></div><div class="lesson"><h3>الوضع غير المتصل</h3><p>المحتوى محفوظ داخل اللعبة ويمكن لعبه بلا إنترنت.</p></div></div>';else d.classList.remove('open')}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');drawerView(b.dataset.view)});
render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
